name: bitbox
description: Flutter bindings for BitBox02 hardware wallet using Rust
version: 0.2.0
publish_to: 'none'

environment:
  sdk: "3.12.1"
  flutter: "3.44.1"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.0
  ffi: ^2.1.0

  flutter_rust_bridge: 2.12.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  ffigen: ^20.1.1

flutter:
  plugin:
    platforms:
      android:
        package: com.bitbox.bitbox_flutter
        pluginClass: BitboxFlutterPlugin

